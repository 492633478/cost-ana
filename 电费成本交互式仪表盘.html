<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电费成本交互式分析仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; padding: 20px; }
  .dashboard { max-width: 1200px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .toggle-group { display: flex; gap: 0; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 4px; }
  .toggle-btn { padding: 8px 20px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer; border-radius: 6px; transition: all 0.3s; font-weight: 500; }
  .toggle-btn.active { background: #fff; color: #1a365d; font-weight: 600; }
  .toggle-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.3s; }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-label { font-size: 13px; color: #718096; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 700; color: #1a365d; }
  .kpi-unit { font-size: 14px; color: #718096; font-weight: 400; }
  .kpi-change { font-size: 12px; margin-top: 6px; }
  .kpi-change.up { color: #e53e3e; }
  .kpi-change.down { color: #38a169; }
  .kpi-single { display: block; }
  .kpi-single.hide { display: none; }
  .kpi-compare { display: none; }
  .kpi-compare.show { display: block; }
  .kpi-compare-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
  .kpi-old-val { font-size: 14px; color: #a0aec0; text-decoration: line-through; }
  .kpi-arrow { font-size: 14px; color: #718096; margin: 0 2px; }
  .kpi-new-val { font-size: 22px; font-weight: 700; }
  .kpi-compare-unit { font-size: 12px; color: #718096; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 15px; font-weight: 600; color: #2d3748; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
  .chart-container { width: 100%; height: 320px; }
  .chart-container.tall { height: 380px; }
  .tip { text-align: center; color: #a0aec0; font-size: 12px; margin-top: 12px; }
  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">

<div class="header">
  <div>
    <h1>电费成本交互式分析仪表盘</h1>
    <p>点击右上角按钮切换年份数据 | 数据来源：核心成本控制-电费</p>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn active" onclick="switchYear('2025')">2025年</button>
    <button class="toggle-btn" onclick="switchYear('2026')">2026年</button>
    <button class="toggle-btn" onclick="switchYear('compare')">两年对比</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi-card">
    <div class="kpi-label">总电费</div>
    <div class="kpi-single" id="kpi-single-electricity">
      <div class="kpi-value"><span id="kpi-electricity">4602.74</span><span class="kpi-unit"> 万元</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-electricity">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">2410.92</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#5B8FF9">2125.55</span>
        <span class="kpi-compare-unit">万元</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-electricity-change">全年累计</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">总产能</div>
    <div class="kpi-single" id="kpi-single-capacity">
      <div class="kpi-value"><span id="kpi-capacity">2011.64</span><span class="kpi-unit"> 万吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-capacity">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">1029.17</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#F6BD16">926.40</span>
        <span class="kpi-compare-unit">万吨</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-capacity-change">月均167.6万吨</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">单吨电费</div>
    <div class="kpi-single" id="kpi-single-cost">
      <div class="kpi-value"><span id="kpi-cost">2.29</span><span class="kpi-unit"> 元/吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-cost">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">2.34</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#38A169">2.29</span>
        <span class="kpi-compare-unit">元/吨</span>
      </div>
    </div>
    <div class="kpi-change down" id="kpi-cost-change">规模效应显著</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">单吨电耗</div>
    <div class="kpi-single" id="kpi-single-energy">
      <div class="kpi-value"><span id="kpi-energy">3.49</span><span class="kpi-unit"> kwh/吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-energy">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">3.62</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#38A169">3.62</span>
        <span class="kpi-compare-unit">kwh/吨</span>
      </div>
    </div>
    <div class="kpi-change down" id="kpi-energy-change">能耗控制良好</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card full">
    <div class="chart-title" id="title1">单吨电费月度趋势</div>
    <div class="chart-container tall" id="chart1"></div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <div class="chart-title" id="title2">单吨电耗趋势</div>
    <div class="chart-container" id="chart2"></div>
  </div>
  <div class="chart-card">
    <div class="chart-title" id="title3">月电费与月产能关系</div>
    <div class="chart-container" id="chart3"></div>
  </div>
</div>

<div class="tip">💡 提示：点击顶部"2025年"/"2026年"/"两年对比"按钮，所有图表和指标会同步切换</div>

</div>

<script>
// ========== 数据 ==========
const data2025 = {
  months: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  costPerTon: [3.20, 2.86, 2.46, 2.29, 2.14, 2.03, 2.32, 2.38, 1.98, 2.07, 2.25, 2.46],
  energyPerTon: [3.82, 3.65, 3.68, 3.71, 3.61, 3.51, 3.38, 3.38, 3.30, 3.41, 3.40, 3.40],
  electricity: [240.37, 195.82, 309.43, 379.44, 433.82, 400.68, 451.35, 497.51, 406.72, 379.82, 400.46, 507.31],
  capacity: [75.20, 68.55, 125.72, 165.41, 202.97, 196.93, 194.39, 208.78, 205.67, 183.47, 178.24, 206.31],
  kpi: { electricity: '4602.74', capacity: '2011.64', cost: '2.29', energy: '3.49' }
};

const data2026 = {
  months: ['1月','2月','3月','4月','5月','6月','7月'],
  costPerTon: [2.24, 3.32, 2.17, 2.21, 2.17, 2.05, 2.81],
  energyPerTon: [3.49, 3.59, 3.48, 3.63, 3.58, 3.64, 3.93],
  electricity: [428.92, 159.65, 289.07, 357.80, 324.78, 312.21, 253.12],
  capacity: [191.57, 48.07, 133.22, 161.83, 149.58, 151.99, 90.14],
  kpi: { electricity: '2125.55', capacity: '926.40', cost: '2.29', energy: '3.62' }
};

// ========== 初始化图表 ==========
const chart1 = echarts.init(document.getElementById('chart1'));
const chart2 = echarts.init(document.getElementById('chart2'));
const chart3 = echarts.init(document.getElementById('chart3'));

const baseTooltip = { trigger: 'axis', triggerOn: 'click', renderMode: 'richText', confine: true };

function renderCharts(data, mode) {
  // KPI更新
  document.getElementById('kpi-electricity').textContent = data.kpi.electricity;
  document.getElementById('kpi-capacity').textContent = data.kpi.capacity;
  document.getElementById('kpi-cost').textContent = data.kpi.cost;
  document.getElementById('kpi-energy').textContent = data.kpi.energy;

  // 切换单年/对比模式
  var singles = ['kpi-single-electricity','kpi-single-capacity','kpi-single-cost','kpi-single-energy'];
  var compares = ['kpi-compare-electricity','kpi-compare-capacity','kpi-compare-cost','kpi-compare-energy'];
  if (mode === 'compare') {
    singles.forEach(function(id){ document.getElementById(id).classList.add('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.add('show'); });
  } else {
    singles.forEach(function(id){ document.getElementById(id).classList.remove('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.remove('show'); });
  }

  if (mode === '2025') {
    document.getElementById('kpi-electricity-change').textContent = '全年累计';
    document.getElementById('kpi-electricity-change').className = 'kpi-change';
    document.getElementById('kpi-capacity-change').textContent = '月均167.6万吨';
    document.getElementById('kpi-capacity-change').className = 'kpi-change';
    document.getElementById('kpi-cost-change').textContent = '规模效应显著';
    document.getElementById('kpi-cost-change').className = 'kpi-change down';
    document.getElementById('kpi-energy-change').textContent = '能耗控制良好';
    document.getElementById('kpi-energy-change').className = 'kpi-change down';
    document.getElementById('title1').textContent = '单吨电费月度趋势（2025年）';
    document.getElementById('title2').textContent = '单吨电耗趋势（2025年）';
    document.getElementById('title3').textContent = '月电费与月产能关系（2025年）';
  } else if (mode === '2026') {
    document.getElementById('kpi-electricity-change').textContent = '1-7月累计';
    document.getElementById('kpi-electricity-change').className = 'kpi-change';
    document.getElementById('kpi-capacity-change').textContent = '1-7月，月均132.3万吨';
    document.getElementById('kpi-capacity-change').className = 'kpi-change';
    document.getElementById('kpi-cost-change').textContent = '与2025年基本持平';
    document.getElementById('kpi-cost-change').className = 'kpi-change down';
    document.getElementById('kpi-energy-change').textContent = '7月能耗上升';
    document.getElementById('kpi-energy-change').className = 'kpi-change up';
    document.getElementById('title1').textContent = '单吨电费月度趋势（2026年1-7月）';
    document.getElementById('title2').textContent = '单吨电耗趋势（2026年1-7月）';
    document.getElementById('title3').textContent = '月电费与月产能关系（2026年1-7月）';
  } else if (mode === 'compare') {
    document.getElementById('kpi-electricity-change').textContent = '同比 -11.8%（2025年1-7月对比）';
    document.getElementById('kpi-electricity-change').className = 'kpi-change down';
    document.getElementById('kpi-capacity-change').textContent = '同比 -10.0%（2025年1-7月对比）';
    document.getElementById('kpi-capacity-change').className = 'kpi-change up';
    document.getElementById('kpi-cost-change').textContent = '同比 -2.1%（2025年1-7月对比）';
    document.getElementById('kpi-cost-change').className = 'kpi-change down';
    document.getElementById('kpi-energy-change').textContent = '同比基本持平（2025年1-7月对比）';
    document.getElementById('kpi-energy-change').className = 'kpi-change';
  }

  // 图1：单吨电费趋势
  let option1 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 30, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: '元/吨', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } }
  };

  if (mode === 'compare') {
    option1.series = [
      { name: '2025年', type: 'line', smooth: true, data: data2025.costPerTon.slice(0, 7), itemStyle: { color: '#5B8FF9' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(91,143,249,0.1)' }, symbol: 'circle', symbolSize: 8 },
      { name: '2026年', type: 'line', smooth: true, data: data2026.costPerTon, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(246,189,22,0.1)' }, symbol: 'circle', symbolSize: 8 }
    ];
    option1.legend.data = ['2025年', '2026年'];
    document.getElementById('title1').textContent = '单吨电费趋势对比（2025 vs 2026，1-7月）';
  } else {
    option1.series = [
      { name: '单吨电费', type: 'line', smooth: true, data: data.costPerTon, itemStyle: { color: mode === '2025' ? '#5B8FF9' : '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: mode === '2025' ? 'rgba(91,143,249,0.12)' : 'rgba(246,189,22,0.12)' }, symbol: 'circle', symbolSize: 8, label: { show: true, position: 'top', fontSize: 10, formatter: '{c}' } }
    ];
    option1.legend.data = ['单吨电费'];
  }
  chart1.setOption(option1, true);

  // 图2：单吨电耗趋势
  let option2 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 20, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: { type: 'value', name: 'kwh/吨', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } },
    series: [
      { name: '单吨电耗', type: 'line', smooth: true, data: data.energyPerTon, itemStyle: { color: '#9F7AEA' }, lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6, areaStyle: { color: 'rgba(159,122,234,0.1)' } }
    ]
  };
  if (mode === 'compare') {
    option2.xAxis.data = data2025.months.slice(0, 7);
    option2.series = [
      { name: '2025年', type: 'line', smooth: true, data: data2025.energyPerTon.slice(0, 7), itemStyle: { color: '#5B8FF9' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '2026年', type: 'line', smooth: true, data: data2026.energyPerTon, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    option2.legend.data = ['2025年', '2026年'];
    document.getElementById('title2').textContent = '单吨电耗趋势对比（2025 vs 2026，1-7月）';
  }
  chart2.setOption(option2, true);

  // 图3：电费与产能（柱线组合）
  let option3 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 50, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: [
      { type: 'value', name: '电费(万元)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
      { type: 'value', name: '产能(万吨)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } }
    ],
    series: [
      { name: '月电费', type: 'bar', data: data.electricity, itemStyle: { color: 'rgba(91,143,249,0.7)', borderRadius: [4, 4, 0, 0] }, barWidth: '40%' },
      { name: '月产能', type: 'line', yAxisIndex: 1, smooth: true, data: data.capacity, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 7 }
    ]
  };
  if (mode === 'compare') {
    option3.xAxis.data = data2025.months.slice(0, 7);
    option3.series = [
      { name: '电费2025', type: 'bar', data: data2025.electricity.slice(0, 7), itemStyle: { color: 'rgba(91,143,249,0.5)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '电费2026', type: 'bar', data: data2026.electricity, itemStyle: { color: 'rgba(91,143,249,0.9)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '产能2025', type: 'line', yAxisIndex: 1, smooth: true, data: data2025.capacity.slice(0, 7), itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '产能2026', type: 'line', yAxisIndex: 1, smooth: true, data: data2026.capacity, itemStyle: { color: '#E8684A' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    document.getElementById('title3').textContent = '月电费与月产能两年对比（1-7月）';
  }
  chart3.setOption(option3, true);
}

// ========== 切换函数 ==========
function switchYear(year) {
  document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (year === '2025') {
    renderCharts(data2025, '2025');
  } else if (year === '2026') {
    renderCharts(data2026, '2026');
  } else {
    renderCharts(data2025, 'compare');
  }
}

// 初始渲染
renderCharts(data2025, '2025');

// 响应式
window.addEventListener('resize', function() {
  chart1.resize();
  chart2.resize();
  chart3.resize();
});
</script>
</body>
</html>
