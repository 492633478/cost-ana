<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人工成本交互式分析仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; padding: 20px; }
  .dashboard { max-width: 1200px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); color: #fff; padding: 20px 32px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .header-logo { height: 40px; width: auto; margin-right: 16px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .toggle-group { display: flex; gap: 0; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 4px; }
  .toggle-btn { padding: 8px 20px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer; border-radius: 6px; transition: all 0.3s; font-weight: 500; }
  .toggle-btn.active { background: #fff; color: #1a365d; font-weight: 600; }
  .toggle-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.3s; }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-label { font-size: 13px; color: #718096; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 700; color: #1a365d; }
  .kpi-unit { font-size: 14px; color: #718096; font-weight: 400; }
  .kpi-change { font-size: 12px; margin-top: 6px; }
  .kpi-change.up { color: #e53e3e; }
  .kpi-change.down { color: #38a169; }
  .kpi-single { display: block; }
  .kpi-single.hide { display: none; }
  .kpi-compare { display: none; }
  .kpi-compare.show { display: block; }
  .kpi-compare-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
  .kpi-old-val { font-size: 14px; color: #a0aec0; text-decoration: line-through; }
  .kpi-arrow { font-size: 14px; color: #718096; margin: 0 2px; }
  .kpi-new-val { font-size: 22px; font-weight: 700; }
  .kpi-compare-unit { font-size: 12px; color: #718096; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 15px; font-weight: 600; color: #2d3748; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
  .chart-container { width: 100%; height: 320px; }
  .chart-container.tall { height: 380px; }
  .tip { text-align: center; color: #a0aec0; font-size: 12px; margin-top: 12px; }
  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">

<div class="header">
  <img src="logo.png" class="header-logo" alt="浙江交通集团">
  <div>
    <h1>人工成本交互式分析仪表盘</h1>
    <p>点击右上角按钮切换年份数据 | 数据来源：核心成本控制-人工费</p>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn active" onclick="switchYear('2025')">2025年</button>
    <button class="toggle-btn" onclick="switchYear('2026')">2026年</button>
    <button class="toggle-btn" onclick="switchYear('compare')">两年对比</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi-card">
    <div class="kpi-label" id="kpi-label-capacity">总产能</div>
    <div class="kpi-single" id="kpi-single-capacity">
      <div class="kpi-value"><span id="kpi-capacity">2011.64</span><span class="kpi-unit"> 万吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-capacity">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">1029.17</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#5B8FF9">919.44</span>
        <span class="kpi-compare-unit">万吨</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-capacity-change">月均167.6万吨</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label" id="kpi-label-salary">总工资</div>
    <div class="kpi-single" id="kpi-single-salary">
      <div class="kpi-value"><span id="kpi-salary">3186.67</span><span class="kpi-unit"> 万元</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-salary">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">1781.04</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#F6BD16">1698.13</span>
        <span class="kpi-compare-unit">万元</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-salary-change">不含137.71万年终奖</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label" id="kpi-label-cost">单吨人工成本</div>
    <div class="kpi-single" id="kpi-single-cost">
      <div class="kpi-value"><span id="kpi-cost">1.58</span><span class="kpi-unit"> 元/吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-cost">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">1.73</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#E8684A">1.85</span>
        <span class="kpi-compare-unit">元/吨</span>
      </div>
    </div>
    <div class="kpi-change down" id="kpi-cost-change">规模效应显著</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label" id="kpi-label-gap">新老线效率差</div>
    <div class="kpi-single" id="kpi-single-gap">
      <div class="kpi-value"><span id="kpi-gap">35.4</span><span class="kpi-unit"> %</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-gap">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">38.2</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#E8684A">40.8</span>
        <span class="kpi-compare-unit">%</span>
      </div>
    </div>
    <div class="kpi-change up" id="kpi-gap-change">老线优于新线</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card full">
    <div class="chart-title" id="title1">单吨人工成本月度趋势</div>
    <div class="chart-container tall" id="chart1"></div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <div class="chart-title" id="title2">新线 vs 老线单吨成本对比</div>
    <div class="chart-container" id="chart2"></div>
  </div>
  <div class="chart-card">
    <div class="chart-title" id="title3">月工资与月产能关系</div>
    <div class="chart-container" id="chart3"></div>
  </div>
</div>

<div class="tip">💡 提示：点击顶部"2025年"/"2026年"/"两年对比"按钮，所有图表和指标会同步切换</div>

</div>

<script>
// ========== 数据 ==========
const data2025 = {
  months: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  totalCost: [3.17, 3.21, 2.08, 1.57, 1.33, 1.34, 1.38, 1.42, 1.36, 1.55, 1.49, 1.35],
  newLine: [1.67, 2.05, 1.20, 0.83, 0.69, 0.72, 0.81, 0.72, 0.71, 0.77, 0.75, 0.73],
  oldLine: [0.97, 1.27, 0.83, 0.64, 0.53, 0.55, 0.55, 0.59, 0.51, 0.54, 0.61, 0.50],
  salary: [238.7, 220.2, 260.9, 259.3, 270.6, 263.6, 267.7, 296.5, 280.6, 285.1, 265.5, 278.0],
  capacity: [75.2, 68.5, 125.7, 165.4, 203.0, 196.9, 194.4, 208.8, 205.7, 183.5, 178.2, 206.3],
  kpi: { capacity: '2011.64', salary: '3186.67', cost: '1.58', gap: '35.4' }
};

const data2026 = {
  months: ['1月','2月','3月','4月','5月','6月','7月'],
  totalCost: [1.44, 2.59, 1.98, 1.61, 1.73, 1.71, 3.00],
  newLine: [0.71, 1.38, 1.19, 0.84, 1.00, 0.72, 3.67],
  oldLine: [0.56, 0.78, 0.74, 0.64, 0.67, 0.76, 0.97],
  salary: [276.5, 119.4, 265.7, 255.1, 257.8, 259.5, 264.1],
  capacity: [192.0, 46.1, 134.5, 158.0, 149.3, 151.6, 88.1],
  kpi: { capacity: '919.44', salary: '1698.13', cost: '1.85', gap: '40.8' }
};

// ========== 初始化图表 ==========
const chart1 = echarts.init(document.getElementById('chart1'));
const chart2 = echarts.init(document.getElementById('chart2'));
const chart3 = echarts.init(document.getElementById('chart3'));

const baseTooltip = { trigger: 'axis', triggerOn: 'click', renderMode: 'richText', confine: true };

function renderCharts(data, mode) {
  // KPI更新
  document.getElementById('kpi-capacity').textContent = data.kpi.capacity;
  document.getElementById('kpi-salary').textContent = data.kpi.salary;
  document.getElementById('kpi-cost').textContent = data.kpi.cost;
  document.getElementById('kpi-gap').textContent = data.kpi.gap;

  // 切换单年/对比模式显示
  var singles = ['kpi-single-capacity','kpi-single-salary','kpi-single-cost','kpi-single-gap'];
  var compares = ['kpi-compare-capacity','kpi-compare-salary','kpi-compare-cost','kpi-compare-gap'];
  if (mode === 'compare') {
    singles.forEach(function(id){ document.getElementById(id).classList.add('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.add('show'); });
  } else {
    singles.forEach(function(id){ document.getElementById(id).classList.remove('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.remove('show'); });
  }

  if (mode === '2025') {
    document.getElementById('kpi-label-capacity').textContent = '总产能';
    document.getElementById('kpi-label-salary').textContent = '总工资';
    document.getElementById('kpi-label-cost').textContent = '单吨人工成本';
    document.getElementById('kpi-label-gap').textContent = '新老线效率差';
    document.getElementById('kpi-capacity-change').textContent = '全年累计，月均167.6万吨';
    document.getElementById('kpi-capacity-change').className = 'kpi-change';
    document.getElementById('kpi-salary-change').textContent = '不含137.71万年终奖';
    document.getElementById('kpi-salary-change').className = 'kpi-change';
    document.getElementById('kpi-cost-change').textContent = '规模效应显著';
    document.getElementById('kpi-cost-change').className = 'kpi-change down';
    document.getElementById('kpi-gap-change').textContent = '老线优于新线';
    document.getElementById('kpi-gap-change').className = 'kpi-change up';
    document.getElementById('title1').textContent = '单吨人工成本月度趋势（2025年）';
    document.getElementById('title2').textContent = '新线 vs 老线单吨成本对比（2025年）';
    document.getElementById('title3').textContent = '月工资与月产能关系（2025年）';
  } else if (mode === '2026') {
    document.getElementById('kpi-label-capacity').textContent = '总产能（1-7月累计）';
    document.getElementById('kpi-label-salary').textContent = '总工资（1-7月累计）';
    document.getElementById('kpi-label-cost').textContent = '单吨人工成本（1-7月）';
    document.getElementById('kpi-label-gap').textContent = '新老线效率差（1-7月）';
    document.getElementById('kpi-capacity-change').textContent = '1-7月，月均131.3万吨';
    document.getElementById('kpi-capacity-change').className = 'kpi-change';
    document.getElementById('kpi-salary-change').textContent = '1-7月累计';
    document.getElementById('kpi-salary-change').className = 'kpi-change';
    document.getElementById('kpi-cost-change').textContent = '同比上升17.1%';
    document.getElementById('kpi-cost-change').className = 'kpi-change up';
    document.getElementById('kpi-gap-change').textContent = '差距持续扩大';
    document.getElementById('kpi-gap-change').className = 'kpi-change up';
    document.getElementById('title1').textContent = '单吨人工成本月度趋势（2026年1-7月）';
    document.getElementById('title2').textContent = '新线 vs 老线单吨成本对比（2026年1-7月）';
    document.getElementById('title3').textContent = '月工资与月产能关系（2026年1-7月）';
  } else if (mode === 'compare') {
    document.getElementById('kpi-label-capacity').textContent = '总产能（1-7月同期对比）';
    document.getElementById('kpi-label-salary').textContent = '总工资（1-7月同期对比）';
    document.getElementById('kpi-label-cost').textContent = '单吨人工成本（1-7月同期对比）';
    document.getElementById('kpi-label-gap').textContent = '新老线效率差（1-7月同期对比）';
    // 对比模式：红字显示同比变化
    document.getElementById('kpi-capacity-change').textContent = '同比 -10.7%（2025年1-7月对比）';
    document.getElementById('kpi-capacity-change').className = 'kpi-change up';
    document.getElementById('kpi-salary-change').textContent = '同比 -4.7%（2025年1-7月对比）';
    document.getElementById('kpi-salary-change').className = 'kpi-change up';
    document.getElementById('kpi-cost-change').textContent = '同比 +6.9%（2025年1-7月对比）';
    document.getElementById('kpi-cost-change').className = 'kpi-change up';
    document.getElementById('kpi-gap-change').textContent = '同比 +2.6个百分点（2025年1-7月对比）';
    document.getElementById('kpi-gap-change').className = 'kpi-change up';
  }

  // 图1：单吨成本趋势
  let option1 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 30, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: '元/吨', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } }
  };

  if (mode === 'compare') {
    option1.series = [
      { name: '2025年', type: 'line', smooth: true, data: data2025.totalCost.slice(0, 7), itemStyle: { color: '#5B8FF9' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(91,143,249,0.1)' }, symbol: 'circle', symbolSize: 8 },
      { name: '2026年', type: 'line', smooth: true, data: data2026.totalCost, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(246,189,22,0.1)' }, symbol: 'circle', symbolSize: 8 }
    ];
    option1.legend.data = ['2025年', '2026年'];
    document.getElementById('title1').textContent = '单吨人工成本趋势对比（2025 vs 2026，1-7月）';
  } else {
    option1.series = [
      { name: '单吨成本', type: 'line', smooth: true, data: data.totalCost, itemStyle: { color: mode === '2025' ? '#5B8FF9' : '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: mode === '2025' ? 'rgba(91,143,249,0.12)' : 'rgba(246,189,22,0.12)' }, symbol: 'circle', symbolSize: 8, label: { show: true, position: 'top', fontSize: 10, formatter: '{c}' } }
    ];
    option1.legend.data = ['单吨成本'];
  }
  chart1.setOption(option1, true);

  // 图2：新线vs老线
  let option2 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 20, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: { type: 'value', name: '元/吨', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } },
    series: [
      { name: '新线(干法)', type: 'line', smooth: true, data: data.newLine, itemStyle: { color: '#E8684A' }, lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6 },
      { name: '老线(湿法)', type: 'line', smooth: true, data: data.oldLine, itemStyle: { color: '#5AD8A6' }, lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6 }
    ]
  };
  if (mode === 'compare') {
    option2.xAxis.data = data2025.months.slice(0, 7);
    option2.series = [
      { name: '新线2025', type: 'line', smooth: true, data: data2025.newLine.slice(0, 7), itemStyle: { color: '#E8684A' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '新线2026', type: 'line', smooth: true, data: data2026.newLine, itemStyle: { color: '#E8684A' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 },
      { name: '老线2025', type: 'line', smooth: true, data: data2025.oldLine.slice(0, 7), itemStyle: { color: '#5AD8A6' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '老线2026', type: 'line', smooth: true, data: data2026.oldLine, itemStyle: { color: '#5AD8A6' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    document.getElementById('title2').textContent = '新线/老线单吨成本两年对比（1-7月）';
  }
  chart2.setOption(option2, true);

  // 图3：工资与产能（柱线组合）
  let option3 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 50, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: [
      { type: 'value', name: '工资(万元)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
      { type: 'value', name: '产能(万吨)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } }
    ],
    series: [
      { name: '月工资', type: 'bar', data: data.salary, itemStyle: { color: 'rgba(91,143,249,0.7)', borderRadius: [4, 4, 0, 0] }, barWidth: '40%' },
      { name: '月产能', type: 'line', yAxisIndex: 1, smooth: true, data: data.capacity, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 7 }
    ]
  };
  if (mode === 'compare') {
    option3.xAxis.data = data2025.months.slice(0, 7);
    option3.series = [
      { name: '工资2025', type: 'bar', data: data2025.salary.slice(0, 7), itemStyle: { color: 'rgba(91,143,249,0.5)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '工资2026', type: 'bar', data: data2026.salary, itemStyle: { color: 'rgba(91,143,249,0.9)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '产能2025', type: 'line', yAxisIndex: 1, smooth: true, data: data2025.capacity.slice(0, 7), itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '产能2026', type: 'line', yAxisIndex: 1, smooth: true, data: data2026.capacity, itemStyle: { color: '#E8684A' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    document.getElementById('title3').textContent = '月工资与月产能两年对比（1-7月）';
  }
  chart3.setOption(option3, true);
}

// ========== 切换函数 ==========
function switchYear(year) {
  // 更新按钮状态
  document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (year === '2025') {
    renderCharts(data2025, '2025');
  } else if (year === '2026') {
    renderCharts(data2026, '2026');
  } else {
    renderCharts(data2025, 'compare');
  }
}

// 初始渲染
renderCharts(data2025, '2025');

// 响应式
window.addEventListener('resize', function() {
  chart1.resize();
  chart2.resize();
  chart3.resize();
});
</script>
</body>
</html>
