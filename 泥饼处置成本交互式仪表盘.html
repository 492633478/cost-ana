<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泥饼处置成本交互式分析仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; padding: 20px; }
  .dashboard { max-width: 1200px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
  .header h1 { font-size: 22px; }
  .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .toggle-group { display: flex; gap: 0; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 4px; }
  .toggle-btn { padding: 8px 20px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 14px; cursor: pointer; border-radius: 6px; transition: all 0.3s; font-weight: 500; }
  .toggle-btn.active { background: #fff; color: #1a365d; font-weight: 600; }
  .toggle-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.1); }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.3s; }
  .kpi-card:hover { transform: translateY(-2px); }
  .kpi-label { font-size: 13px; color: #718096; margin-bottom: 8px; }
  .kpi-value { font-size: 26px; font-weight: 700; color: #1a365d; }
  .kpi-unit { font-size: 14px; color: #718096; font-weight: 400; }
  .kpi-change { font-size: 12px; margin-top: 6px; }
  .kpi-change.up { color: #e53e3e; }
  .kpi-change.down { color: #38a169; }
  .kpi-single { display: block; }
  .kpi-single.hide { display: none; }
  .kpi-compare { display: none; }
  .kpi-compare.show { display: block; }
  .kpi-compare-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
  .kpi-old-val { font-size: 14px; color: #a0aec0; text-decoration: line-through; }
  .kpi-arrow { font-size: 14px; color: #718096; margin: 0 2px; }
  .kpi-new-val { font-size: 22px; font-weight: 700; }
  .kpi-compare-unit { font-size: 12px; color: #718096; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 15px; font-weight: 600; color: #2d3748; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0; }
  .chart-container { width: 100%; height: 320px; }
  .chart-container.tall { height: 380px; }
  .tip { text-align: center; color: #a0aec0; font-size: 12px; margin-top: 12px; }
  @media (max-width: 768px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .chart-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">

<div class="header">
  <div>
    <h1>泥饼处置成本交互式分析仪表盘</h1>
    <p>点击右上角按钮切换年份数据 | 数据来源：核心成本控制-泥饼处置</p>
  </div>
  <div class="toggle-group">
    <button class="toggle-btn active" onclick="switchYear('2025')">2025年</button>
    <button class="toggle-btn" onclick="switchYear('2026')">2026年</button>
    <button class="toggle-btn" onclick="switchYear('compare')">两年对比</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi-card">
    <div class="kpi-label">处置总价</div>
    <div class="kpi-single" id="kpi-single-total">
      <div class="kpi-value"><span id="kpi-total">3047.16</span><span class="kpi-unit"> 万元</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-total">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">1331.25</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#E8684A">2034.63</span>
        <span class="kpi-compare-unit">万元</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-total-change">全年累计</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">处置数量</div>
    <div class="kpi-single" id="kpi-single-volume">
      <div class="kpi-value"><span id="kpi-volume">86.95</span><span class="kpi-unit"> 万吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-volume">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">52.14</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#5B8FF9">43.66</span>
        <span class="kpi-compare-unit">万吨</span>
      </div>
    </div>
    <div class="kpi-change" id="kpi-volume-change">全年累计</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">平均处置单价</div>
    <div class="kpi-single" id="kpi-single-price">
      <div class="kpi-value"><span id="kpi-price">35.05</span><span class="kpi-unit"> 元/吨</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-price">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">25.53</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#E8684A">46.61</span>
        <span class="kpi-compare-unit">元/吨</span>
      </div>
    </div>
    <div class="kpi-change up" id="kpi-price-change">7月起单价上调</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-label">泥饼产率</div>
    <div class="kpi-single" id="kpi-single-rate">
      <div class="kpi-value"><span id="kpi-rate">5.06</span><span class="kpi-unit"> %</span></div>
    </div>
    <div class="kpi-compare" id="kpi-compare-rate">
      <div class="kpi-compare-row">
        <span class="kpi-old-val">5.48</span>
        <span class="kpi-arrow">→</span>
        <span class="kpi-new-val" style="color:#38A169">5.64</span>
        <span class="kpi-compare-unit">%</span>
      </div>
    </div>
    <div class="kpi-change down" id="kpi-rate-change">产率控制良好</div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card full">
    <div class="chart-title" id="title1">处置单价月度趋势</div>
    <div class="chart-container tall" id="chart1"></div>
  </div>
</div>

<div class="chart-row">
  <div class="chart-card">
    <div class="chart-title" id="title2">泥饼产率趋势</div>
    <div class="chart-container" id="chart2"></div>
  </div>
  <div class="chart-card">
    <div class="chart-title" id="title3">月处置总价与处置数量关系</div>
    <div class="chart-container" id="chart3"></div>
  </div>
</div>

<div class="tip">💡 提示：点击顶部"2025年"/"2026年"/"两年对比"按钮，所有图表和指标会同步切换</div>

</div>

<script>
// ========== 数据 ==========
const data2025 = {
  months: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  price: [18.80, 18.80, 18.80, 18.80, 18.89, 18.89, 49.30, 49.30, 49.30, 49.30, 49.30, 49.30],
  rate: [5.92, 5.66, 6.06, 6.22, 6.35, 3.31, 6.75, 4.97, 5.01, 5.13, 4.25, 2.50],
  totalCost: [98.28, 71.78, 133.01, 157.28, 200.21, 105.62, 565.07, 425.96, 425.42, 346.02, 287.96, 230.55],
  volume: [5.23, 3.82, 7.08, 8.37, 10.60, 5.59, 11.46, 8.64, 8.63, 7.02, 5.84, 4.68],
  kpi: { total: '3047.16', volume: '86.95', price: '35.05', rate: '5.06' }
};

const data2026 = {
  months: ['1月','2月','3月','4月','5月','6月','7月','8月'],
  price: [48.80, 48.80, 48.80, 48.80, 48.80, 39.92, 39.92, 39.92],
  rate: [8.78, 5.40, 5.42, 4.72, 4.23, 5.26, 6.24, 3.98],
  totalCost: [647.82, 141.00, 319.45, 340.14, 155.76, 263.64, 166.81, 150.90],
  volume: [13.27, 2.89, 6.55, 6.97, 3.19, 6.60, 4.18, 3.78],
  kpi: { total: '2034.63', volume: '43.66', price: '46.61', rate: '5.64' }
};

// ========== 初始化图表 ==========
const chart1 = echarts.init(document.getElementById('chart1'));
const chart2 = echarts.init(document.getElementById('chart2'));
const chart3 = echarts.init(document.getElementById('chart3'));

const baseTooltip = { trigger: 'axis', triggerOn: 'click', renderMode: 'richText', confine: true };

function renderCharts(data, mode) {
  // KPI更新
  document.getElementById('kpi-total').textContent = data.kpi.total;
  document.getElementById('kpi-volume').textContent = data.kpi.volume;
  document.getElementById('kpi-price').textContent = data.kpi.price;
  document.getElementById('kpi-rate').textContent = data.kpi.rate;

  // 切换单年/对比模式
  var singles = ['kpi-single-total','kpi-single-volume','kpi-single-price','kpi-single-rate'];
  var compares = ['kpi-compare-total','kpi-compare-volume','kpi-compare-price','kpi-compare-rate'];
  if (mode === 'compare') {
    singles.forEach(function(id){ document.getElementById(id).classList.add('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.add('show'); });
  } else {
    singles.forEach(function(id){ document.getElementById(id).classList.remove('hide'); });
    compares.forEach(function(id){ document.getElementById(id).classList.remove('show'); });
  }

  if (mode === '2025') {
    document.getElementById('kpi-total-change').textContent = '全年累计';
    document.getElementById('kpi-total-change').className = 'kpi-change';
    document.getElementById('kpi-volume-change').textContent = '全年累计';
    document.getElementById('kpi-volume-change').className = 'kpi-change';
    document.getElementById('kpi-price-change').textContent = '7月起单价上调至49.3元';
    document.getElementById('kpi-price-change').className = 'kpi-change up';
    document.getElementById('kpi-rate-change').textContent = '产率控制良好';
    document.getElementById('kpi-rate-change').className = 'kpi-change down';
    document.getElementById('title1').textContent = '处置单价月度趋势（2025年）';
    document.getElementById('title2').textContent = '泥饼产率趋势（2025年）';
    document.getElementById('title3').textContent = '月处置总价与处置数量关系（2025年）';
  } else if (mode === '2026') {
    document.getElementById('kpi-total-change').textContent = '1-8月累计';
    document.getElementById('kpi-total-change').className = 'kpi-change';
    document.getElementById('kpi-volume-change').textContent = '1-8月累计';
    document.getElementById('kpi-volume-change').className = 'kpi-change';
    document.getElementById('kpi-price-change').textContent = '6月起单价下调至39.92元';
    document.getElementById('kpi-price-change').className = 'kpi-change down';
    document.getElementById('kpi-rate-change').textContent = '1月产率偏高';
    document.getElementById('kpi-rate-change').className = 'kpi-change up';
    document.getElementById('title1').textContent = '处置单价月度趋势（2026年1-8月）';
    document.getElementById('title2').textContent = '泥饼产率趋势（2026年1-8月）';
    document.getElementById('title3').textContent = '月处置总价与处置数量关系（2026年1-8月）';
  } else if (mode === 'compare') {
    document.getElementById('kpi-total-change').textContent = '同比 +52.8%（2025年1-7月对比）';
    document.getElementById('kpi-total-change').className = 'kpi-change up';
    document.getElementById('kpi-volume-change').textContent = '同比 -16.3%（2025年1-7月对比）';
    document.getElementById('kpi-volume-change').className = 'kpi-change up';
    document.getElementById('kpi-price-change').textContent = '同比 +82.6%（2025年1-7月对比）';
    document.getElementById('kpi-price-change').className = 'kpi-change up';
    document.getElementById('kpi-rate-change').textContent = '同比 +0.16个百分点（2025年1-7月对比）';
    document.getElementById('kpi-rate-change').className = 'kpi-change up';
  }

  // 图1：处置单价趋势
  let option1 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 30, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', name: '元/吨', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } }
  };

  if (mode === 'compare') {
    option1.series = [
      { name: '2025年', type: 'line', smooth: true, data: data2025.price.slice(0, 7), itemStyle: { color: '#5B8FF9' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(91,143,249,0.1)' }, symbol: 'circle', symbolSize: 8 },
      { name: '2026年', type: 'line', smooth: true, data: data2026.price.slice(0, 7), itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: 'rgba(246,189,22,0.1)' }, symbol: 'circle', symbolSize: 8 }
    ];
    option1.legend.data = ['2025年', '2026年'];
    document.getElementById('title1').textContent = '处置单价趋势对比（2025 vs 2026，1-7月）';
  } else {
    option1.series = [
      { name: '处置单价', type: 'line', smooth: true, data: data.price, itemStyle: { color: mode === '2025' ? '#5B8FF9' : '#F6BD16' }, lineStyle: { width: 2.5 }, areaStyle: { color: mode === '2025' ? 'rgba(91,143,249,0.12)' : 'rgba(246,189,22,0.12)' }, symbol: 'circle', symbolSize: 8, label: { show: true, position: 'top', fontSize: 10, formatter: '{c}' } }
    ];
    option1.legend.data = ['处置单价'];
  }
  chart1.setOption(option1, true);

  // 图2：泥饼产率趋势
  let option2 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 20, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: { type: 'value', name: '%', nameTextStyle: { fontSize: 11 }, axisLabel: { fontSize: 11 } },
    series: [
      { name: '泥饼产率', type: 'line', smooth: true, data: data.rate, itemStyle: { color: '#9F7AEA' }, lineStyle: { width: 2 }, symbol: 'circle', symbolSize: 6, areaStyle: { color: 'rgba(159,122,234,0.1)' } }
    ]
  };
  if (mode === 'compare') {
    option2.xAxis.data = data2025.months.slice(0, 7);
    option2.series = [
      { name: '2025年', type: 'line', smooth: true, data: data2025.rate.slice(0, 7), itemStyle: { color: '#5B8FF9' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '2026年', type: 'line', smooth: true, data: data2026.rate.slice(0, 7), itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    option2.legend.data = ['2025年', '2026年'];
    document.getElementById('title2').textContent = '泥饼产率趋势对比（2025 vs 2026，1-7月）';
  }
  chart2.setOption(option2, true);

  // 图3：处置总价与数量（柱线组合）
  let option3 = {
    backgroundColor: 'transparent',
    tooltip: baseTooltip,
    legend: { top: 8, textStyle: { fontSize: 12 } },
    grid: { left: 50, right: 50, top: 50, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: data.months, axisLabel: { fontSize: 11, rotate: data.months.length > 7 ? 30 : 0 } },
    yAxis: [
      { type: 'value', name: '总价(万元)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
      { type: 'value', name: '数量(万吨)', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } }
    ],
    series: [
      { name: '处置总价', type: 'bar', data: data.totalCost, itemStyle: { color: 'rgba(91,143,249,0.7)', borderRadius: [4, 4, 0, 0] }, barWidth: '40%' },
      { name: '处置数量', type: 'line', yAxisIndex: 1, smooth: true, data: data.volume, itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 7 }
    ]
  };
  if (mode === 'compare') {
    option3.xAxis.data = data2025.months.slice(0, 7);
    option3.series = [
      { name: '总价2025', type: 'bar', data: data2025.totalCost.slice(0, 7), itemStyle: { color: 'rgba(91,143,249,0.5)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '总价2026', type: 'bar', data: data2026.totalCost.slice(0, 7), itemStyle: { color: 'rgba(91,143,249,0.9)', borderRadius: [4, 4, 0, 0] }, barWidth: '30%' },
      { name: '数量2025', type: 'line', yAxisIndex: 1, smooth: true, data: data2025.volume.slice(0, 7), itemStyle: { color: '#F6BD16' }, lineStyle: { width: 2, type: 'dashed' }, symbol: 'circle', symbolSize: 6 },
      { name: '数量2026', type: 'line', yAxisIndex: 1, smooth: true, data: data2026.volume.slice(0, 7), itemStyle: { color: '#E8684A' }, lineStyle: { width: 2.5 }, symbol: 'circle', symbolSize: 8 }
    ];
    document.getElementById('title3').textContent = '月处置总价与数量两年对比（1-7月）';
  }
  chart3.setOption(option3, true);
}

// ========== 切换函数 ==========
function switchYear(year) {
  document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  if (year === '2025') {
    renderCharts(data2025, '2025');
  } else if (year === '2026') {
    renderCharts(data2026, '2026');
  } else {
    renderCharts(data2025, 'compare');
  }
}

// 初始渲染
renderCharts(data2025, '2025');

// 响应式
window.addEventListener('resize', function() {
  chart1.resize();
  chart2.resize();
  chart3.resize();
});
</script>
</body>
</html>
